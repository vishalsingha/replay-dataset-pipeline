# Benchmark Evaluation Configuration
# Usage: python -m eval.run_eval --config eval/eval_config.yaml

model_path: Qwen/Qwen3-4B-Instruct-2507   # HuggingFace model ID or local path

backend: vllm
tensor_parallel_size: 1
gpu_memory_utilization: 0.9
max_model_len: 4096
seed: 42

# Benchmark suites — choose via --suite flag
suites:
  quick:
    - gsm8k
    - ifeval
    - arc_challenge

  standard:
    - gsm8k
    - math
    - humaneval
    - mbpp
    - ifeval
    - mmlu
    - arc_challenge
    - hellaswag

  full:
    - gsm8k
    - math
    - humaneval
    - mbpp
    - ifeval
    - mmlu
    - mmlu_pro
    - arc_challenge
    - hellaswag

# Per-task configuration: num_fewshot and lm-eval task name mapping
tasks:
  gsm8k:
    task_name: gsm8k_cot
    num_fewshot: 5
    metric: exact_match,strict-match

  math:
    task_name: minerva_math
    num_fewshot: 4
    metric: exact_match,strict-match

  humaneval:
    task_name: humaneval
    num_fewshot: 0
    metric: pass@1
    confirm_unsafe_code: true

  mbpp:
    task_name: mbpp
    num_fewshot: 3
    metric: pass@1
    confirm_unsafe_code: true

  ifeval:
    task_name: ifeval
    num_fewshot: 0
    metric: prompt_level_strict_acc

  mmlu:
    task_name: mmlu
    num_fewshot: 5
    metric: acc

  mmlu_pro:
    task_name: mmlu_pro
    num_fewshot: 5
    metric: acc

  arc_challenge:
    task_name: arc_challenge
    num_fewshot: 25
    metric: acc_norm

  hellaswag:
    task_name: hellaswag
    num_fewshot: 10
    metric: acc_norm

# Output settings
output_dir: eval/results
